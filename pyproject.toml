[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepmem"
version = "0.4.0"
description = "StepMem：用生成过程内部状态驱动可扩展步骤记忆的 Hugging Face 推理引擎。"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "StepMem" }]
keywords = ["llm", "memory", "huggingface", "inference", "attention", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.48",
    "numpy>=1.24",
    "safetensors>=0.4",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
stepmem = "stepmem.cli:main"

[tool.setuptools.packages.find]
include = ["stepmem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
